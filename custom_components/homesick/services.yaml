log_measurement:
  name: Log measurement
  description: Log a health measurement for a person.
  fields:
    person_id:
      name: Person ID
      description: UUID of the person (available as attribute on sensors).
      required: true
      example: "5ace5d6f-ddb6-495d-a5c0-f95661ba9c33"
      selector:
        text:
    type:
      name: Type
      description: Type of measurement.
      required: true
      example: temperature
      selector:
        select:
          options:
            - temperature
            - blood_pressure
            - pulse
            - weight
            - height
            - bmi
            - waist
            - blood_glucose
            - spo2
            - pain
            - mood
    value:
      name: Value
      description: Measurement value.
      required: true
      example: 37.5
      selector:
        number:
          mode: box
          step: 0.1
    value2:
      name: Value 2
      description: Second value, e.g. diastolic blood pressure.
      required: false
      example: 80
      selector:
        number:
          mode: box
    unit:
      name: Unit
      description: Unit of measurement (e.g. °C, mmHg, kg).
      required: false
      example: "°C"
      selector:
        text:
    note:
      name: Note
      description: Optional note.
      required: false
      selector:
        text:
    timestamp:
      name: Timestamp
      description: ISO 8601 timestamp (defaults to now).
      required: false
      example: "2024-03-01T08:30:00"
      selector:
        text:

log_medication:
  name: Log medication
  description: Log a medication dose for a person.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    medication:
      name: Medication
      description: Name of the medication.
      required: true
      example: Ibuprofen 400mg
      selector:
        text:
    dose:
      name: Dose
      required: false
      example: 400
      selector:
        number:
          mode: box
    dose_unit:
      name: Dose unit
      required: false
      example: mg
      selector:
        text:
    route:
      name: Route
      required: false
      selector:
        select:
          options:
            - oral
            - inhalation
            - injection
            - topical
            - other
    skipped:
      name: Skipped
      description: Mark if the dose was skipped.
      required: false
      selector:
        boolean:
    note:
      name: Note
      required: false
      selector:
        text:

add_symptom:
  name: Log wellbeing
  description: Log wellbeing, pain and symptoms for a person.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    pain:
      name: Pain level
      description: NRS 0–10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          mode: slider
    mood:
      name: Mood
      description: 1 (very bad) – 5 (very good).
      required: false
      selector:
        number:
          min: 1
          max: 5
          mode: slider
    tags:
      name: Symptom tags
      description: List of symptoms, e.g. ["cough", "fever"].
      required: false
      selector:
        text:
    note:
      name: Note
      required: false
      selector:
        text:

add_person:
  name: Add person
  description: Add a new person to the journal.
  fields:
    name:
      name: Name
      required: true
      example: Anna
      selector:
        text:
    birth_date:
      name: Date of birth
      required: false
      example: "1990-01-15"
      selector:
        text:
    gender:
      name: Gender
      required: false
      selector:
        select:
          options:
            - male
            - female
            - other

delete_entry:
  name: Delete entry
  description: Delete a specific entry (measurement, medication, symptom).
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    entry_id:
      name: Entry ID
      required: true
      selector:
        text:

get_summary:
  name: Get summary
  description: Show a summary as an HA notification.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    hours:
      name: Hours
      description: How many hours back the summary should cover (1–720).
      required: false
      example: 24
      selector:
        number:
          min: 1
          max: 720
          mode: box
